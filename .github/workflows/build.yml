name: Build Sonic Mania PC

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: SonicMania-Linux
            build-dir: build
          - os: windows-latest
            artifact-name: SonicMania-Windows
            build-dir: build/Release

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # --- LINUX DEPENDENCIES ---
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libsdl2-dev libglew-dev libvorbis-dev libtheora-dev

    # --- WINDOWS DEPENDENCIES (vcpkg handles this via cmake) ---
    - name: Set up msbuild (Windows)
      if: matrix.os == 'windows-latest'
      uses: microsoft/setup-msbuild@v2

    # --- BUILD PROCESS ---
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    # --- ARTIFACT PACKAGING ---
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          ${{ matrix.build-dir }}/SonicMania*
          ${{ matrix.build-dir }}/*.exe
          ${{ matrix.build-dir }}/*.dll
          ${{ matrix.build-dir }}/*.so
        if-no-files-found: warn
